version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: proxispeak_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - proxispeak_net

  redis:
    image: redis:7-alpine
    container_name: proxispeak_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - proxispeak_net

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: proxispeak_server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: super_secret_proxispeak_jwt_token_key_change_in_production
      MONGODB_URI: mongodb://mongodb:27017/proxispeak
      REDIS_URL: redis://redis:6379
      PROXIMITY_RADIUS: 100
      PROXIMITY_EXIT_RADIUS: 120
      SPATIAL_GRID_CELL_SIZE: 100
      STUN_SERVER_URL: stun:stun.l.google.com:19302
    depends_on:
      - mongodb
      - redis
    networks:
      - proxispeak_net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: proxispeak_client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - proxispeak_net

volumes:
  mongo_data:
  redis_data:

networks:
  proxispeak_net:
    driver: bridge
